<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdf3e6">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f7a9bd'/%3E%3Ctext x='32' y='43' font-size='26' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23014b3e'%3E100%3C/text%3E%3C/svg%3E">
  <title>100 Dinomamis y Dinopapis dijeron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="viewer">
  <div class="viewer-bg" aria-hidden="true"></div>

  <div class="v-shell">
    <header class="v-top">
      <div class="v-brand" id="brand">
        <img class="v-brand__logo" id="logo" src="img/logo.png" alt="100 Dinomamis y Dinopapis dijeron">
        <img class="v-baby-logo" src="img/babyshower.png" alt="Logo Baby Shower">
        <div class="v-brand__fallback">
          <strong>100</strong>
          <span>Dinomamis y Dinopapis dijeron</span>
        </div>
      </div>
    </header>

    <!-- Diseño del tablero (grande y bonito) -->
    <div class="board" id="board">
      <div class="question-ribbon">
        <span class="question-ribbon__tag">Pregunta</span>
        <h1 class="question-ribbon__text" id="question" aria-live="polite">Preparando la primera ronda…</h1>
      </div>

      <div class="round-status-wrap">
        <div class="round-status" id="roundStatus" role="status" aria-live="polite">Ronda no iniciada</div>
      </div>

      <div class="score-panel score-panel--left" id="teamLeft">
        <span class="sr-only">Dinomamis</span>
        <span class="score-panel__score" id="scoreLeft">000</span>
      </div>

      <div class="score-panel score-panel--right" id="teamRight">
        <span class="sr-only">Dinopapis</span>
        <span class="score-panel__score" id="scoreRight">000</span>
      </div>

      <div class="round-points">
        <span class="round-points__label">En juego</span>
        <span class="round-points__value" id="bankValue">0</span>
      </div>

      <span class="round-points__round" id="roundLabel">Ronda 1/6</span>

      <div class="main-screen">
        <ul class="answers" id="answers" aria-live="polite"></ul>
      </div>

      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="banner" id="banner" aria-hidden="true"></div>

      <div class="v-board__foot">
        <span class="chip" id="stateChip">Cara a cara</span>
        <span class="v-status" id="status" aria-live="polite"></span>
      </div>

      <div class="v-meta__strikes">
        <span class="strike-label">Equis</span>
        <div class="strikes" id="strikeDots" role="img" aria-label="0 de 3 equis"></div>
      </div>
    </div>

    <section class="timer-panel timer-panel--viewer" id="timerPanel" aria-label="Cronómetro">
      <span>TIEMPO PARA RESPONDER</span>
      <div class="timer-display"><span id="timerValue" role="timer">--</span><span>segundos</span></div>
      <span id="timerStatus">Desactivado</span>
    </section>

    <section class="card-carousel" id="cardCarousel" aria-label="Tarjetas para los invitados" hidden>
      <div class="card-carousel__stage">
        <img class="card-carousel__image" alt="Tarjeta para los invitados">
        <img class="card-carousel__image" alt="" aria-hidden="true">
      </div>
    </section>

    <div class="winner" id="winner" aria-hidden="true">
      <div class="winner__card">
        <p class="winner__kicker">Fin del juego</p>
        <h2 class="winner__title" id="winnerTitle"></h2>
        <p class="winner__score" id="winnerScore"></p>
        <p class="winner__hint">¡Gracias por jugar!</p>
      </div>
    </div>

    <footer class="v-bottom">
      <span class="conn" id="conn"><i></i><span id="connText">Conectando…</span></span>
      <button class="soft-btn soft-btn--ghost soft-btn--sm" id="soundBtn" type="button" aria-pressed="true">Sonido: ON</button>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/gameplay-ui.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
